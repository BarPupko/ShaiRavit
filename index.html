<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>רויטל ושי - החתונה</title>
    <meta name="description" content="Revital and Shay are getting married - 28.10.2026, אולמי &quot;לבן&quot;">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Heebo:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="card">
        <img class="monogram" src="images/logo.png" alt="RS">

        <h1 class="names" lang="en" dir="ltr">REVITAL <span class="and">and</span> SHAY</h1>
        <p class="subtitle" lang="en" dir="ltr">are getting married</p>

        <p class="date">28.10.2026</p>
        <p class="venue">אולמי "לבן"</p>

        <div class="actions">
            <a class="btn btn-pill" id="wazeBtn"
               href="https://waze.com/ul?ll=32.8019066,35.0737602&navigate=yes">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 3 3 10.5l7.5 3L13.5 21 21 3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                </svg>
                <span>ניווט לאולמי "לבן"</span>
            </a>

            <section class="gift-box">
                <h2>למתנה באמצעות</h2>
                <div class="gift-options">
                    <a class="gift-btn" href="https://bit.ly/4iPNeDn" target="_blank" rel="noopener" aria-label="אשראי">
                        <img class="card-icon" src="images/credit-card.png" alt="">
                        <span class="gift-label">אשראי</span>
                    </a>

                    <a class="gift-btn" href="https://www.bitpay.co.il/app/share-info?i=sO_Gf2u7&j=true" target="_blank" rel="noopener" aria-label="bit">
                        <img class="brand-logo bit-logo" src="images/bit.png" alt="bit">
                    </a>

                    <a class="gift-btn" href="https://links.payboxapp.com/RrI1Lmdo96b" target="_blank" rel="noopener" aria-label="paybox">
                        <img class="brand-logo paybox-logo" src="images/paybox.webp" alt="paybox">
                    </a>
                </div>
            </section>

            <a class="btn btn-pill" href="https://lavaneruim.co.il/" target="_blank" rel="noopener">
                <span>לאתר האולם</span>
            </a>
        </div>

        <footer class="credit">
            עוצב על ידי <a href="https://barpopko.com/systems/" target="_blank" rel="noopener">בר פופקו</a>
        </footer>
    </main>

    <script>
        // Open the Waze app directly; if it isn't installed, send the user to the store.
        (function () {
            var LL = '32.8019066,35.0737602';
            var PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.waze';
            var APP_STORE = 'https://apps.apple.com/app/id323229106';
            var ua = navigator.userAgent;
            var isAndroid = /Android/i.test(ua);
            var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

            document.getElementById('wazeBtn').addEventListener('click', function (e) {
                if (isAndroid) {
                    e.preventDefault();
                    // Android intent: opens Waze, or the Play Store if it's missing
                    window.location.href = 'intent://?ll=' + LL + '&navigate=yes#Intent;scheme=waze;package=com.waze;' +
                        'S.browser_fallback_url=' + encodeURIComponent(PLAY_STORE) + ';end';
                } else if (isIOS) {
                    e.preventDefault();
                    var start = Date.now();
                    window.location.href = 'waze://?ll=' + LL + '&navigate=yes';
                    // If the page is still visible, the app didn't open - go to the App Store
                    setTimeout(function () {
                        if (!document.hidden && Date.now() - start < 2500) {
                            window.location.href = APP_STORE;
                        }
                    }, 1500);
                }
                // Desktop: follow the normal Waze web link
            });
        })();
    </script>
</body>
</html>
